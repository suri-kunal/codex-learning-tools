name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/education-tools/package-lock.json
      - name: Install development dependencies
        working-directory: plugins/education-tools
        run: npm ci
      - name: Run tests
        working-directory: plugins/education-tools
        run: npm test
      - name: Rebuild bundled MCP server
        working-directory: plugins/education-tools
        run: npm run build
      - name: Verify generated bundle is committed
        run: git diff --exit-code -- plugins/education-tools/dist/server.mjs
      - name: Validate marketplace and manifests
        run: node scripts/validate-repo.mjs
